version: '3'
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.10.3
    volumes:
      - ./config:/config
    environment:
      - TZ=Australia/Melbourne
    restart: unless-stopped
    stop_grace_period: 60s
    network_mode: host
  vtuner:
    profiles: [legacy]
    container_name: vtuner
    build: ./vtuner
    environment:
      - PORT=8080
    restart: always
    network_mode: host
  nginx:
    profiles: [legacy]
    container_name: nginx
    image: nginx
    volumes:
      - ./nginx:/etc/nginx/templates
    ports:
      - "8080:80"
    environment:
      - HASS_IO_ADDRESS=http://homeassistant:8123
      - VTUNER_ADDRESS=http://vtuner:8080
